name: Native iOS Metal IPA

on:
  push:
    branches: [ios, ci/ios-metal-m57-25c]
  workflow_dispatch:
    inputs:
      full_game:
        description: Build, validate, and privately deliver the unsigned game IPA
        type: boolean
        required: true
        default: true
      asset_bundle_release_tag:
        description: Draft asset release in the private vault; blank uses the configured current tag
        type: string
        required: false
      connected_world:
        description: Connect Castle Grounds and Hyrule in one area (requires the private O2R tag)
        type: boolean
        required: false
        default: false
      hat_movement:
        description: Enable hat throw and bounce for an iPhone test build
        type: boolean
        required: false
        default: false
      scene_diagnostic:
        description: Include the original WSC2 diagnostic room and developer menu commands
        type: boolean
        required: false
        default: false
      hyrule_o2r_release_tag:
        description: Optional private draft O2R release tag; leave blank for connected Castle Grounds only
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ios-metal-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-checks:
    if: >-
      github.repository == 'LawrenceBanes/sm64ios-metal' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-ipa]'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsdl2-dev
      - name: Run Linux regressions and host checks
        run: |
          CC=clang tests/run_linux_checks.sh
          tests/check_metal_project_wiring.sh
      - name: Validate Python tools and shell scripts
        run: |
          python3 -m py_compile tools/hyrule_importer.py ios/asset_bundle.py ios/asset_checksum.py ios/package_unsigned_ipa.py ios/stage_ios_runtime.py ios/validate_ipa.py ios/ci_summarize_build_log.py
          bash -n ios/build_sdl2_ios.sh ios/build_ios_metal_ci.sh
          python3 -m unittest discover -s ios -p 'test_ci_summarize_build_log.py'
          python3 -m unittest discover -s ios -p 'test_ipa_validation.py'
          python3 -m unittest discover -s ios -p 'test_stage_ios_runtime.py'

  ios-arm64-ipa:
    needs: linux-checks
    if: >-
      github.repository == 'LawrenceBanes/sm64ios-metal' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-ipa]'))
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SDL2_REVISION: 5d249570393f7a37e037abf22cd6012a4cc56a71
      IOS_HYRULE_WORLD: '0'
      IOS_CONNECTED_WORLD: '0'
      IOS_CONNECTED_WORLD_TEST: '1'
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build SDL2 and validate Metal/MSL with Xcode 27
        shell: bash
        run: bash ios/build_ios_metal_ci.sh validate

      - name: Build complete app, package IPA, and upload only to private vault
        if: ${{ inputs.full_game || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-ipa]')) }}
        shell: bash
        env:
          SM64_ASSET_PRIVATE_REPOSITORY: ${{ vars.SM64_ASSET_PRIVATE_REPOSITORY }}
          SM64_IPA_PRIVATE_REPOSITORY: ${{ vars.SM64_IPA_PRIVATE_REPOSITORY }}
          SM64_PRIVATE_BUILD_GH_TOKEN: ${{ secrets.SM64_PRIVATE_BUILD_GH_TOKEN }}
          ASSET_BUNDLE_RELEASE_TAG: ${{ inputs.asset_bundle_release_tag || vars.SM64_ASSET_BUNDLE_RELEASE_TAG }}
          HYRULE_O2R_RELEASE_TAG: ${{ inputs.hyrule_o2r_release_tag }}
          IOS_HYRULE_WORLD: ${{ inputs.hyrule_o2r_release_tag != '' && '1' || '0' }}
          IOS_HYRULE_GATE_DIAGNOSTICS: ${{ inputs.hyrule_o2r_release_tag != '' && '1' || '0' }}
          IOS_HAT_MOVEMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.hat_movement && '1' || '0' }}
          IOS_CONNECTED_WORLD: ${{ github.event_name == 'workflow_dispatch' && inputs.connected_world && '1' || '0' }}
          IOS_O2R_SCENE_RUNTIME: ${{ inputs.scene_diagnostic && '1' || '0' }}
          IOS_SCENE_DIAGNOSTIC: ${{ inputs.scene_diagnostic && '1' || '0' }}
        run: bash ios/build_ios_metal_ci.sh full

      - name: Upload asset-free diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-metal-safe-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/sm64-ios-ci/safe/
          if-no-files-found: warn
          retention-days: 7
