name: iOS Metal CI (asset-safe)

# This path already exists on the default branch, so GitHub permits a manual
# dispatch against the isolated CI branch. There are no push or PR triggers.
on:
  workflow_dispatch:
    inputs:
      full_game:
        description: Build and validate an unsigned game IPA using a separate private asset repository (never upload it)
        type: boolean
        required: true
        default: false
      asset_bundle_release_tag:
        description: Draft release tag in the configured private asset repository; required for full_game
        type: string
        required: false
      hyrule_o2r_release_tag:
        description: Optional private draft O2R release tag; leave empty for the normal connected-world build
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ios-metal-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-metal:
    if: github.repository == 'LawrenceBanes/sm64ios-metal'
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      SDL2_REVISION: 5d249570393f7a37e037abf22cd6012a4cc56a71
      IOS_HYRULE_WORLD: '0'
      IOS_CONNECTED_WORLD_TEST: '1'
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build pinned SDL2 and validate iOS Metal/MSL
        shell: bash
        run: bash ios/build_ios_metal_ci.sh validate

      - name: Compile full game and validate IPA on runner only
        if: ${{ inputs.full_game }}
        shell: bash
        env:
          SM64_ASSET_PRIVATE_REPOSITORY: ${{ vars.SM64_ASSET_PRIVATE_REPOSITORY }}
          SM64_ASSET_GH_TOKEN: ${{ secrets.SM64_ASSET_GH_TOKEN }}
          ASSET_BUNDLE_RELEASE_TAG: ${{ inputs.asset_bundle_release_tag }}
          HYRULE_O2R_RELEASE_TAG: ${{ inputs.hyrule_o2r_release_tag }}
          IOS_HYRULE_WORLD: ${{ inputs.hyrule_o2r_release_tag != '' && '1' || '0' }}
        run: bash ios/build_ios_metal_ci.sh full

      - name: Upload asset-free diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-metal-safe-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/sm64-ios-ci/safe/
          if-no-files-found: warn
          retention-days: 7
