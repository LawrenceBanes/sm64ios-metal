workflows:
  connected-world-ios:
    name: Mission 55.6 Connected World iOS Metal
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - sm64_private_assets
      vars:
        SDL2_REVISION: 5d249570393f7a37e037abf22cd6012a4cc56a71
        IOS_HYRULE_WORLD: "0"
        IOS_CONNECTED_WORLD_TEST: "1"
      xcode: "27.1"
    scripts:
      - name: Build unsigned connected-world iPhoneOS app and validate Metal
        script: bash ios/build_codemagic_connected_world.sh
    artifacts:
      - build/codemagic-connected-world/safe/toolchain.log
      - build/codemagic-connected-world/safe/sdl2-build.log
      - build/codemagic-connected-world/safe/metal-validation.log
      - build/codemagic-connected-world/safe/ci-status.txt
      - build/codemagic-connected-world/safe/ios-build-summary.txt
